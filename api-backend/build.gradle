plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.topstep.api'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // Trading Engine Module
    implementation project(':trading-engine')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Database
    runtimeOnly 'org.xerial:sqlite-jdbc:3.45.1.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.4.Final'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}

tasks.named('test') {
    useJUnitPlatform()
    // Controller tests construct EngineFacade (which loads EngineConfig):
    // keep them hermetic from a developer's ~/topstep-trading/engine.properties.
    systemProperty 'engine.props', 'NONE'
}

// V5 Agent 01 — bootRun parity with the trading-engine test JVM and with
// `java -jar api-backend-*.jar`: forward the SAME engine -D list
// (gradle/engine-config.gradle), plus server.port. The engine itself loads
// ${user.home}/topstep-trading/engine.properties at EngineFacade construction
// (or the file given with -Pengine.props=<path>), exactly as the jar does.
apply from: rootProject.file('gradle/engine-config.gradle')

tasks.named('bootRun') {
    engineForwardedSystemProperties().each { k, v -> systemProperty k, v }
    if (System.getProperty('server.port') != null) {
        systemProperty 'server.port', System.getProperty('server.port')
    }
    // -Pengine.userHome=<dir> mirrors the owner's `java -Duser.home=<dir> -jar ...`
    if (project.hasProperty('engine.userHome')) {
        systemProperty 'user.home', project.property('engine.userHome').toString()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
