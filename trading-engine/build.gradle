plugins {
    id 'java'
    id 'application'
}

group = 'com.topstep.trading'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // WebSocket Client
    implementation 'org.eclipse.jetty.websocket:websocket-jetty-client:11.0.20'

    // Database
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

application {
    mainClass = 'com.topstep.trading.TradingEngineMain'
}

tasks.named('test') {
    useJUnitPlatform()
    // Forward the diagnosis/tuning properties into the TEST JVM so the
    // FunnelReplayHarness (offline real-tape replay) can be parameterized
    // from the gradle command line. Absent properties forward as null and
    // change nothing.
    ['funnel.data.dir', 'funnel.symbol', 'scalpMode.enabled', 'scalp.minRaidScore',
     'bias.hysteresis.enabled', 'bias.neutralGraceBars',
     'trade.profile', 'profile.sim.file', 'chart.anchorMode', 'chart.oteBand',
     'chart.anchorCompare',
     'stdvote.detectorTimeframe', 'stdvOte.setupExpiryBars',
     'stdvOte.oteWindowBars', 'stdvOte.mssFreshBars',
     'stdvote.displacement.atrMult', 'stdvote.displacement.bodyPct'].each { p ->
        if (System.getProperty(p) != null) {
            systemProperty p, System.getProperty(p)
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
