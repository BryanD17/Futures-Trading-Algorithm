plugins {
    id 'java'
    id 'application'
}

group = 'com.topstep.trading'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // WebSocket Client
    implementation 'org.eclipse.jetty.websocket:websocket-jetty-client:11.0.20'

    // Database
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

application {
    mainClass = 'com.topstep.trading.TradingEngineMain'
}

apply from: rootProject.file('gradle/engine-config.gradle')

tasks.named('test') {
    useJUnitPlatform()
    // V5 Agent 01: forward EVERY engine -D flag (the shared prefix list in
    // gradle/engine-config.gradle — the SAME list api-backend's bootRun
    // forwards) into the TEST JVM, so the FunnelAutopsy/FunnelReplay
    // harnesses run the configuration bootRun / java -jar run. Absent
    // properties forward nothing and change nothing.
    engineForwardedSystemProperties().each { k, v -> systemProperty k, v }
    // Hermetic by default: unit tests never read a developer's
    // ~/topstep-trading/engine.properties unless asked to with
    // -Pengine.props=<path> (or -Dengine.props=<path>).
    if (!engineForwardedSystemProperties().containsKey('engine.props')) {
        systemProperty 'engine.props', 'NONE'
    }
    // Re-run tests when the forwarded configuration changes.
    inputs.property('engineForwardedSystemProperties', engineForwardedSystemProperties().toString())
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
