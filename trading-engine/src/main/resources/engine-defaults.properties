# ============================================================================
# engine-defaults.properties  —  V5 product defaults (Agent 01, RC-01)
# ============================================================================
# The DEFAULT layer of EngineConfig. Precedence (highest first):
#   -D<key>=v  >  ENGINE_<KEY> env  >  ${user.home}/topstep-trading/engine.properties
#   >  this file  >  code default (EngineConfig.KEYS)
# Every key the engine reads is listed in EngineConfig.KEYS and printed in the
# EFFECTIVE ENGINE CONFIG table at boot (GET /api/status -> effectiveConfig).
# Only values that DIFFER from the code default (or that another agent reads
# for the first time) belong here; everything else stays at its code default.
# Risk envelope (DLL / MLL / max contracts / 14:45-17:00 CT flatten) is NOT
# configurable here and never will be.
# ============================================================================

# All-sessions entry (owner directive; M3 becomes SCORING — consumer Agent 02).
session.allSessions=true
session.gateMode=SCORING

# Owner's proven 1m backfill depth (was passed by hand as -Dbackfill.days=7).
backfill.days=7

# NEUTRAL-flip hysteresis ON (RC-04: one NEUTRAL 15m read must not kill a setup).
bias.hysteresis=true

# V5 Agent 03 (RC-04..RC-08): bias = dealing-range anchor + ADAPTIVE vote;
# M2b judged on the dealing range and BLOCKING; grace 3 NEUTRAL 15m reads.
bias.vote.mode=VOTE
bias.voteRule=ADAPTIVE
bias.source=RANGE
bias.neutralGraceBars=3
pd.gate.mode=BLOCK

# V5 Agent 05.6 (G2 parity): from 09:30 ET the dealing range is the RTH impulse
# leg once it spans >= 400 ticks (100 MNQ pt); before that (and all of Asia /
# London / pre-NY) the Globex session-day range. A/B: bias.range.window=SESSION_DAY.
bias.range.window=AUTO
bias.range.minLegTicks=400
# V5 Agent 05.7: the previous session's governing range (the RTH impulse under
# AUTO) keeps governing across the 18:00 ET reopen until the new session prints
# an impulse leg >= minLegTicks. A/B: bias.range.carryAcrossReopen=false.
bias.range.carryAcrossReopen=true

# V5 Agent 04 (RC-09..RC-13, RC-18): calibrated displacement (the G1 15:00 bar
# has body 0.534 - 0.55 would drop it), FVG linkage, dealing-range OTE with the
# chart fibs, ONE RR band (validator + risk engine), M7b SCORING.
displacement.atrMult=1.2
displacement.bodyPct=0.50
displacement.recentBars=12
fvg.linkBars=3
ote.anchorMode=DEALING_RANGE
ote.fib62=0.618
ote.fib705=0.705
ote.fib79=0.786
ote.windowBars=8
mss.freshBars=30
ote30m.mode=SCORING
risk.rrFloor=1.0
risk.rrFloor.scalp=0.8
risk.rrCeiling=5.0

# V5 Agent 05.2: impulse-leg entry model. The dealing range's impulse leg
# (its displacement + FVG and structure break) satisfies M5/M6; the setup arms
# on a sweep INSIDE the range's OTE band that reaches the 0.705 and alarms on
# the rejection. POST_SWEEP = the pre-05.2 sequence (A/B + fallback).
ote.entryModel=IMPULSE_LEG
ote.impulseLeg.minSweepFib=0.705
# V5 Agent 05.5: the IMPULSE_LEG order block at the sweep is the ICT OB = the
# newest opposite-close 1m candle within ote.obLookbackBars before the sweep bar
# whose range overlaps the band (09-25 10:05 bar). SWEEP_BAR = 05.2 (A/B).
ote.pdArraySource=ICT_OB
ote.obLookbackBars=5

# Strategy selection: never silently fall back to the legacy strategy.
strategy.legacyFallback=false

# scalp.enabled is intentionally NOT set (stays at its code default false).

# V5 Agent 05 (RC-13..RC-15): post-signal pipeline. Risk-derived size with a
# 1-micro floor (the old hard 5-micro floor stood the 09-24 PRE_NY setup down),
# ONE RR band shared by the validator and PropFirmRiskEngine, deterministic
# warmup with a timeout. risk.haltOnProfitTarget / order.ttlBars stay unset
# (mode-dependent / derived defaults — see EngineConfig.KEYS).
warmup.timeoutSeconds=120
size.minMicros=1
size.preferredMicros=5
size.maxMicros=20
news.blockWithoutCalendar=false

# V5 Agent 05.1 (starvation S2): PHASE-AWARE setup expiry. 85/104 swept setups
# died "expired" exactly 61 bars after the sweep under ONE 60-min hunt budget
# (21 of them after the MSS, still waiting for the retrace). Each post-sweep
# phase now gets its own budget, reset on the state transition (minutes = 1m
# feed bars). OTE_ARMED -> emit stays ote.windowBars. setup.expiryAnchor is NOT
# set here: the code default follows session.gateMode (SCORING -> PHASED,
# BLOCKING -> BIAS_SET); set it to SWEEP_DONE_TOTAL for the Agent 02 A/B.
setup.expiry.sweepToDisplacement=60
setup.expiry.displacementToMss=60
setup.expiry.mssToOte=240

# V5 Agent 05.3: re-arm after the position closes in EVERY target model
# (legacy sat IN_TRADE until "expired (200 bars)" and missed the 09-28 14:53
# G1 short). false = one trade per window (A/B). The unfilled entry order of
# a setup that ends (invalidated / expired / re-armed) is cancelled at once;
# order.ttlBars stays the backstop.
setup.rearmAfterClose=true

# V5 Agent 05.8 - opt-in COUNTER-TREND SCALP (default OFF = byte-identical engine).
# ON: short a premium-OTE-band sweep of a BULLISH dealing range back to its
# equilibrium (T1) / the top of the discount band (final), mirror for longs;
# bounded by session, range size, half the $ risk budget and 2 per day.
entry.counterTrendScalp=false
entry.counterTrend.sessions=ASIA,LONDON,PRE_NY
entry.counterTrend.minRangeTicks=400
entry.counterTrend.maxRiskFraction=0.5
entry.counterTrend.maxPerDay=2

# V5 Agent 05.9 - opt-in INDEPENDENT LTF dealing-range machine (default OFF =
# byte-identical engine). ON: a second full setup machine per symbol whose
# dealing range is the most recent confirmed 5m fractal swing leg >= minLegTicks
# (own bias = its direction, own equilibrium / OTE / T1 = LTF eq / T2 = LTF far
# edge / stop beyond the LTF sweep); same M1..M9 chain; one position per symbol.
# gating=HTF_ALIGNED is the comparison mode. Per-symbol legs: range.ltf.minLegTicks.MES / .MGC.
range.ltf.enabled=false
range.ltf.minLegTicks=120
range.ltf.window=INTRADAY_SWINGS
range.ltf.gating=INDEPENDENT
range.ltf.maxPerDay=4
range.ltf.riskFraction=1.0
range.ltf.sessions=ASIA,LONDON,PRE_NY,NY_AM,NY_LUNCH,NY_PM,PRE_ASIA
