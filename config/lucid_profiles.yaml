# config/lucid_profiles.yaml — Lucid account profiles (DATA ONLY, no code)
# Agent 01 (V6). Retrieval date for every source: 2026-11-05.
# Consumed by: tools/pine_build.py (Agent 03 presets), RiskProfile loader (Agent 05).
# Rule: every number carries a source URL. Numbers marked conservative_unverified
# are NOT on a Lucid page and must be re-checked when the owner gets a reply.
# Micro math: 1 mini = 10 micros (Lucid states sizes as "N minis or 10N micros").

meta:
  retrieved: "2026-11-05"
  venue: "Lucid Trading"
  platform: "Tradovate (CQG feed)"
  timezone_rules: "America/New_York (Lucid writes 'EST'); CT = ET - 1h"
  sources:
    eval:        "https://support.lucidtrading.com/en/articles/12945790-lucidflex-evaluation-account"
    funded:      "https://support.lucidtrading.com/en/articles/12945795-lucidflex-funded-account"
    drawdown:    "https://support.lucidtrading.com/en/articles/12945815-lucidflex-drawdown"
    scaling:     "https://support.lucidtrading.com/en/articles/12945808-lucidflex-scaling-plan"
    consistency: "https://support.lucidtrading.com/en/articles/12945805-lucidflex-consistency-percentage"
    payouts:     "https://support.lucidtrading.com/en/articles/12945796-lucidflex-payouts"
    customize:   "https://support.lucidtrading.com/en/articles/16226050-lucidflex-customization"
    hours:       "https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times"
    microscalp:  "https://support.lucidtrading.com/en/articles/11404742-prohibited-microscalping"
    hedging:     "https://support.lucidtrading.com/en/articles/11404734-prohibited-hedging"
    hft:         "https://support.lucidtrading.com/en/articles/11404736-prohibited-high-frequency-trading"
    automation:  "https://support.lucidtrading.com/en/articles/11404728-other-trading-activities"
    accounts:    "https://support.lucidtrading.com/en/articles/11404617-maximum-number-of-accounts"
    commissions: "https://support.lucidtrading.com/en/articles/11508978-approved-products-and-commissions"
    inactivity:  "https://support.lucidtrading.com/en/articles/11404632-inactivity-policy"

# Rules shared by every LucidFlex profile (eval and funded).
common:
  forced_flat_et: "16:45"            # source: hours  ("closed by 4:45 PM EST")
  forced_flat_ct: "15:45"
  session_open_et: "18:00"           # source: hours  (Sun–Thu 6:00 PM EST)
  overnight_allowed: false           # source: hours
  v6_no_entry_after_et: "16:30"      # master prompt I3 (5 min inside Lucid's flat)
  v6_flatten_at_et: "16:40"          # master prompt I3
  drawdown_type: "EOD_TRAILING"      # source: drawdown
  drawdown_lock_offset_usd: 100      # source: drawdown (Locked MLL = initial + $100)
  drawdown_breach_rule: "balance_touches_mll"   # source: drawdown
  payout_locks_mll: true             # source: drawdown
  news_trading_allowed: true         # source: automation (Flex/Pro/Direct)
  automation_allowed: true           # source: automation
  trade_copier_allowed: true         # source: automation
  hedging_prohibited: true           # source: hedging
  hedging_definition: "multiple accounts taking opposing positions on the same trade; also opposing correlated instruments across accounts"  # source: hedging
  hft_prohibited: true               # source: hft (no numeric threshold published)
  microscalp_hold_seconds: 5         # source: microscalp
  microscalp_profit_share_max: 0.50  # source: microscalp (">50% of profits from trades held <=5s")
  max_accounts_total_household: 10   # source: accounts
  max_funded_accounts_household: 5   # source: accounts
  inactivity_days: 30                # source: inactivity
  commission_per_side_usd:
    MNQ: 0.50                        # source: commissions
    MES: 0.50
    NQ: 1.75
    ES: 1.75
  tick_value_usd:                    # CME contract specs (not Lucid); used for micro math
    MNQ: 0.50
    MES: 1.25
    NQ: 2.00
    ES: 12.50

profiles:

  LUCID_FLEX_50K_EVAL:
    plan: "LucidFlex"
    stage: "EVAL"
    starting_balance_usd: 50000           # source: eval
    profit_target_usd: 3000               # source: eval
    max_loss_limit_usd: 2000              # source: eval, funded, drawdown
    initial_trail_balance_usd: 52100      # source: drawdown
    locked_mll_balance_usd: 50100         # source: drawdown
    daily_loss_limit:
      optional: true                      # source: eval, customize ("On or Off" at checkout)
      amount_usd: null                    # NOT PUBLISHED -> OA-7; conservative_unverified
      breach_type: "soft_lockout_until_next_session"   # source: customize
    v6_soft_daily_loss_usd: 600           # master prompt 03.5 default = 30% of MLL; conservative_unverified
    max_contracts_minis: 4                # source: eval
    max_contracts_micros: 40              # source: eval
    scaling_plan_applies: false           # source: scaling ("no scaling plan in the evaluation phase")
    scaling_cap_micros: 40                # = max size (no scaling in eval)
    consistency_max_pct: 40               # source: consistency (50 with paid add-on)
    consistency_addon_pct: 50             # source: consistency
    consistency_formula: "largest_single_day_profit / account_profit"   # source: consistency
    min_trading_days: 3                   # source: eval (2 with 50% add-on)
    min_trading_days_with_addon: 2        # source: eval
    time_limit_days: null                 # source: eval ("take as long as you need")
    activation_fee_usd: 0                 # source: eval
    purchase_price_usd: null              # lucidtrading.com returned HTTP 403; not needed by code

